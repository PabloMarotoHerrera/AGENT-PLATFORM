skill_id: skill.safety.command_review
title: Safety Command Review
status: candidate
lifecycle_state: blueprint_candidate
source_refs:
  - source_system: agent_platform
    path: 0_architecture/governance/agent_platform_skill_stack_bootstrap_design.md
    evidence_kind: governance
    authority_tier: governance_authority
  - source_system: agent_platform
    path: 0_architecture/governance/agent_platform_skill_authority_execution_boundary.md
    evidence_kind: governance
    authority_tier: governance_authority
  - source_system: agent_platform
    path: 0_architecture/governance/agent_platform_gstack_adoption_decision.md
    evidence_kind: governance
    authority_tier: governance_authority
  - source_system: agent_platform
    path: 0_architecture/governance/agent_platform_retention_rollback_incident_hardening.md
    evidence_kind: governance
    authority_tier: governance_authority
purpose: Review command candidates for destructive, credential, source-boundary, runtime, provider, browser, MCP, memory, or Git risks.
non_goals:
  - Enforce hooks.
  - Modify settings.
  - Execute commands.
  - Mutate Git.
  - Activate runtime controls.
taxonomy:
  family: safety_scope_docs
  tags:
    - safety
    - command_review
    - command_candidate
runtime_profile: S2
permission_classes:
  allowed_now: []
  candidate_only:
    - SKILL_READ_DOCS
    - SKILL_READ_SOURCE_METADATA
  blocked:
    - SKILL_WRITE_APPROVED_FILES
    - SKILL_RUN_LOCAL_COMMANDS
    - SKILL_RUN_TESTS
    - SKILL_USE_BROWSER
    - SKILL_USE_MCP
    - SKILL_USE_PROVIDER
    - SKILL_USE_CREDENTIALS
    - SKILL_WRITE_MEMORY
    - SKILL_REGISTER_HOOKS
    - SKILL_MODIFY_SETTINGS
    - SKILL_MUTATE_GIT
    - SKILL_DEPLOY
required_future_gates:
  - local_tool_execution_gate_for_any_command_execution
  - hook_registration_gate_for_any_enforcement_hook
  - settings_mutation_gate_for_any_settings_change
memory_boundary:
  can_read_memory_refs: false
  can_write_memory: false
  can_sync_gbrain: false
  memory_update_output: none
output_boundary:
  allowed_output_classes:
    - review_support
    - command_candidate
  blocked_output_classes:
    - draft_implementation
    - runtime_output
    - browser_provider_mcp_output
    - git_deploy_audit_evidence
    - accepted_governance_source_record
  promotion_required: true
inputs:
  allowed:
    - command_candidate_text
    - working_directory_candidate
    - risk_context
  blocked:
    - credentials
    - secrets
    - provider_configs
    - token_values
command_candidates:
  allowed_to_propose: true
  exact_command_required: true
  execution_allowed: false
file_write_boundary:
  allowed_to_write: false
  allowed_paths: []
runtime_boundary:
  execution_allowed: false
  browser_allowed: false
  mcp_allowed: false
  provider_allowed: false
  git_allowed: false
authority_posture: non_authoritative
p12_10_bootstrap_action: create_blueprint
